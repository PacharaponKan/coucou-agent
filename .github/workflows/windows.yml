name: Windows

# Builds the Windows app and publishes the installer.
# Triggered by tags like `windows-v0.1.0`; the macOS workflows are untouched.

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: write

# Release publishing is paused: Defender flags the unsigned installer as
# Trojan:Win32/Wacatac.H!ml (false positive, reported to Microsoft). CI still
# builds, smoke-tests and uploads a workflow artifact for validation. Set this
# back to 'true' once the installer is signed or the detection is cleared.
env:
  PUBLISH: 'false'
  CODEX_SMOKE_VERSION: '0.159.2'

jobs:
  build:
    outputs:
      version: ${{ steps.pack.outputs.version }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Codex CLI
        shell: pwsh
        run: |
          npm install -g "@openai/codex@$env:CODEX_SMOKE_VERSION"
          $version = codex --version
          $version
          if ($version -notmatch [regex]::Escape($env:CODEX_SMOKE_VERSION)) {
            throw "Expected Codex $env:CODEX_SMOKE_VERSION, got $version"
          }

      - name: Test Rust workspace
        env:
          COUCOU_CODEX_HOOKS_EXPORT: ${{ github.workspace }}\windows\generated-hooks.json
        run: npm run test:rust

      - name: Validate generated Codex hooks with Codex CLI
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP "coucou-codex-generated-hooks"
          New-Item -ItemType Directory -Path $codexHome -Force | Out-Null
          Copy-Item -LiteralPath generated-hooks.json -Destination (Join-Path $codexHome "hooks.json") -Force
          $env:CODEX_HOME = $codexHome
          $env:OPENAI_API_KEY = "sk-test-invalid"
          $stdout = Join-Path $codexHome "stdout.txt"
          $stderr = Join-Path $codexHome "stderr.txt"
          $proc = Start-Process -FilePath (Get-Command codex.cmd).Source -ArgumentList @("exec", "--dangerously-bypass-hook-trust", "ci-hook-parse") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
            throw "Codex hook parser smoke exceeded 30 seconds."
          }
          $text = (Get-Content -LiteralPath $stdout -Raw -ErrorAction SilentlyContinue) + "`n" + (Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue)
          if ($text -match "failed to parse hooks config") { throw $text }
          if ($text -notmatch "hook: SessionStart") {
            throw "Codex did not load the generated SessionStart hook.`n$text"
          }

      # Three files carry the version and they drift silently. Publishing a
      # "0.1.1" that installs a 0.1.0 is the kind of thing nobody notices until
      # a bug report arrives against the wrong build.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # `npm run build` (run by tauri as beforeBuildCommand) builds coucou-hook
      # first, which tauri.conf.json then bundles as a resource. `pack` then
      # copies the installer out of target/ under its shipping name.
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Copy-Item -LiteralPath generated-hooks.json -Destination release\generated-hooks.json -Force
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Windows-setup
          path: windows/release/
          if-no-files-found: error

  smoke:
    name: clean-install-smoke
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Coucou starts without Codex CLI
        shell: pwsh
        run: |
          npm uninstall -g @openai/codex 2>$null
          if (Get-Command codex.cmd -ErrorAction SilentlyContinue) {
            throw "Codex is still on PATH; missing-dependency smoke would be invalid."
          }

      - uses: actions/download-artifact@v4
        with:
          name: Coucou-Windows-setup
          path: windows/artifact

      - name: First-run workflow without Codex
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath artifact -Filter "Coucou-Windows-*-setup.exe" -File -Recurse | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact is missing." }
          .\scripts\smoke-install.ps1 -InstallerPath $installer.FullName -SkipCodexHook -KeepInstalled

      - name: Install pinned Codex CLI
        shell: pwsh
        run: |
          npm install -g "@openai/codex@$env:CODEX_SMOKE_VERSION"
          $version = codex --version
          $version
          if ($version -notmatch [regex]::Escape($env:CODEX_SMOKE_VERSION)) {
            throw "Expected Codex $env:CODEX_SMOKE_VERSION, got $version"
          }

      - name: Reinstall and run Codex workflow end to end
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath artifact -Filter "Coucou-Windows-*-setup.exe" -File -Recurse | Select-Object -First 1
          $hooks = Get-ChildItem -LiteralPath artifact -Filter "generated-hooks.json" -File -Recurse | Select-Object -First 1
          if (-not $installer) { throw "Installer artifact is missing." }
          if (-not $hooks) { throw "Generated Codex hooks artifact is missing." }
          .\scripts\smoke-install.ps1 -InstallerPath $installer.FullName -GeneratedHooksPath $hooks.FullName -PreserveExisting

  publish:
    name: publish-windows
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/windows-v') && needs.build.result == 'success' && needs.smoke.result == 'success'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Coucou-Windows-setup
          path: windows/release

      - name: Publish the release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $notes = @"
          Coucou for Windows $v — Mochi at the top of your screen.

          Download ``Coucou-Windows-$v-setup.exe`` and run it. The installer is not
          code-signed yet, so Windows SmartScreen shows a warning: click
          **More info → Run anyway**.
          "@
          gh release create "${{ github.ref_name }}" `
            "release/Coucou-Windows-$v-setup.exe" `
            --title "Coucou for Windows $v" `
            --notes $notes `
            --latest=false

      - name: Update the rolling windows-latest release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $exists = gh release view windows-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            git tag -f windows-latest "${{ github.sha }}"
            git push -f origin windows-latest
            gh release edit windows-latest --title "Coucou for Windows (latest)" --notes "Always the newest Windows build — currently $v."
            gh release upload windows-latest "release/Coucou-Windows-setup.exe" --clobber
          } else {
            gh release create windows-latest `
              "release/Coucou-Windows-setup.exe" `
              --title "Coucou for Windows (latest)" `
              --notes "Always the newest Windows build — currently $v." `
              --latest=false
          }
